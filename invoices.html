<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Invoices — DreamHarbour</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <a class="logo" href="dashboard.html">DreamHarbour</a>
      <div class="header-right">
        <div id="userName" class="dh-muted">—</div>
        <button id="btnLogout" class="btn btn--sm btn--outline">Logout</button>
      </div>
    </header>

    <main class="content">
      <section class="card">
        <div class="card__header"><h3>Create invoice</h3></div>
        <div class="card__body">
          <form id="invoiceForm">
            <div class="form-group">
              <label class="form-label" for="customerPhone">Customer phone</label>
              <input id="customerPhone" class="form-control" type="text" placeholder="Enter mobile number" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="customerName">Customer name</label>
              <input id="customerName" class="form-control" type="text" placeholder="Customer name">
            </div>
            <div class="form-group">
              <label class="form-label" for="customerEmail">Customer email</label>
              <input id="customerEmail" class="form-control" type="email" placeholder="Email">
            </div>

            <div class="form-group">
              <label class="form-label" for="serviceSelect">Service</label>
              <select id="serviceSelect" class="form-control">
                <option value="">Loading services…</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="quantity">Quantity</label>
              <input id="quantity" class="form-control" type="number" min="1" value="1">
            </div>

            <div class="form-group">
              <button type="submit" class="btn btn--primary">Create invoice</button>
              <button type="button" id="toggleCreate" class="btn btn--outline">Clear</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card mt-8">
        <div class="card__header"><h3>All invoices</h3></div>
        <div class="card__body">
          <table class="table">
            <thead>
              <tr><th>#</th><th>Subtotal</th><th>GST</th><th>Total</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="invoicesTableBody">
              <tr><td colspan="6" class="dh-muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/notifications.js"></script>
  <script type="module" src="/js/invoices.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.initializeInvoices) window.initializeInvoices();
      // fallback: wire a minimal toggle for clear
      document.getElementById('toggleCreate')?.addEventListener('click', () => document.getElementById('invoiceForm')?.reset());
    });
  </script>
</body>
</html>
