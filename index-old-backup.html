<!-- Dream Harbour - Enhanced Login Page with DEBUG MODE (ARCHIVED - Old Design) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Harbour - Login (Old Design)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 48px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .message {
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .error {
            color: #d32f2f;
            background: #ffebee;
            border: 1px solid #ef5350;
        }

        .error.show {
            display: block;
        }

        .success {
            color: #388e3c;
            background: #e8f5e9;
            border: 1px solid #66bb6a;
        }

        .success.show {
            display: block;
        }

        .info {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #42a5f5;
            font-size: 12px;
        }

        .info.show {
            display: block;
        }

        .debug-panel {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }

        .debug-panel h4 {
            margin-top: 0;
            color: #666;
        }

        .debug-log {
            font-family: monospace;
            color: #333;
            line-height: 1.4;
        }

        .debug-log .log-item {
            padding: 4px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .debug-log .success {
            color: #4caf50;
        }

        .debug-log .error {
            color: #f44336;
        }

        .debug-log .info {
            color: #2196f3;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🏛️</div>
        <h1>Dream Harbour</h1>
        <p class="subtitle">Invoice Management System</p>

        <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
                <label for="phone">Phone Number (10 digits)</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your 10-digit phone number" maxlength="10" inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label for="pin">PIN (6 digits)</label>
                <input type="password" id="pin" name="pin" placeholder="Enter your 6-digit PIN" maxlength="6" inputmode="numeric" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div id="info" class="message info"></div>
        <div id="error" class="message error"></div>
        <div id="success" class="message success"></div>

        <!-- Debug Panel -->
        <div class="debug-panel">
            <h4>🔍 Debug Console</h4>
            <div id="debugLog" class="debug-log"></div>
        </div>
    </div>

    <script>
        console.log('This is the OLD design - for reference only. Main design has been updated to modern glassmorphism.');
    </script>
</body>
</html>
