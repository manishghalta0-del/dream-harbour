<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard - Dream Harbour</title><link rel="stylesheet" href="styles.css"><style>.header-top{background:linear-gradient(135deg,#8b5cf6,#06b6d4);padding:24px;color:white;display:flex;justify-content:space-between;align-items:center}.stat-card{background:rgba(33,38,45,0.6);border:1px solid #30363d;border-radius:12px;padding:20px;margin-bottom:20px;backdrop-filter:blur(10px)}.stat-number{font-size:32px;font-weight:700;color:#8b5cf6;margin:8px 0}.stat-label{color:#8b949e;font-size:14px}.invoices-table{width:100%;border-collapse:collapse;background:rgba(33,38,45,0.6);border:1px solid #30363d;border-radius:8px;margin-top:20px}#logout-btn{background:#ef4444;color:white;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:600}</style></head><body><nav class="navbar"><div class="navbar-brand">🏛️ Dream Harbour</div><div class="navbar-user"><span id="userName">Loading...</span><button id="logout-btn" onclick="logout()">Logout</button></div></nav><aside class="sidebar"><a href="dashboard-new.html" class="sidebar-item active">📊 Dashboard</a><a href="invoices-new.html" class="sidebar-item">📄 Invoices</a><a href="settings-new.html" class="sidebar-item">⚙️ Settings</a></aside><main class="main-content"><div class="header-top"><h1>Dashboard</h1><div style="color:white">Session: <span id="sessionTime">5:00</span></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:24px 0"><div class="stat-card"><div style="font-size:28px">💰</div><div class="stat-label">Total Revenue</div><div class="stat-number" id="totalRevenue">₹0.00</div></div><div class="stat-card"><div style="font-size:28px">📋</div><div class="stat-label">Total Invoices</div><div class="stat-number" id="totalInvoices">0</div></div><div class="stat-card"><div style="font-size:28px">👥</div><div class="stat-label">Customers</div><div class="stat-number" id="totalCustomers">0</div></div><div class="stat-card"><div style="font-size:28px">✅</div><div class="stat-label">Paid Invoices</div><div class="stat-number" id="paidInvoices">0</div></div></div><div style="background:rgba(33,38,45,0.6);border:1px solid #30363d;border-radius:12px;padding:24px;backdrop-filter:blur(10px)"><h2 style="margin-bottom:20px">Recent Invoices</h2><table class="invoices-table"><thead style="background:rgba(0,0,0,0.3)"><tr><th style="padding:12px;text-align:left;border-bottom:1px solid #30363d">Invoice #</th><th style="padding:12px;text-align:left;border-bottom:1px solid #30363d">Date</th><th style="padding:12px;text-align:left;border-bottom:1px solid #30363d">Amount</th><th style="padding:12px;text-align:left;border-bottom:1px solid #30363d">Status</th></tr></thead><tbody id="invoicesList"><tr><td colspan="4" style="padding:20px;text-align:center;color:#8b949e">Loading invoices...</td></tr></tbody></table></div></div></main><div id="debug-console" style="position:fixed;bottom:0;right:0;width:400px;max-height:150px;background:rgba(15,17,23,0.95);border:1px solid #30363d;border-bottom:none;border-right:none;overflow-y:auto;padding:12px;font-family:monospace;font-size:11px;z-index:1000;color:#8b949e"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>function logout(){clearUserSession();window.location.href='index.html'}function formatDate(d){return new Date(d).toLocaleDateString('en-IN')}async function loadDashboard(){const user=getUserSession();if(!user){window.location.href='index.html';return}document.getElementById('userName').textContent=user.full_name;setInterval(()=>{const start=parseInt(localStorage.getItem('sessionStartTime')||Date.now());const elapsed=Date.now()-start;const remaining=300000-elapsed;if(remaining>0){const min=Math.floor(remaining/60000);const sec=(remaining%60000)/1000;document.getElementById('sessionTime').textContent=min+':'+(sec<10?'0':'')+Math.floor(sec)}},1000);(async()=>{const invoices=await fetchInvoices(10)||[];const customers=await fetchCustomers()||[];let paid=0;let totalRev=0;invoices.forEach(inv=>{if(inv.payment_status==='paid'){paid++;totalRev+=(inv.total_amount||0)}});document.getElementById('totalInvoices').textContent=invoices.length;document.getElementById('totalCustomers').textContent=customers.length;document.getElementById('paidInvoices').textContent=paid;document.getElementById('totalRevenue').textContent=formatCurrency(totalRev);const tbody=document.getElementById('invoicesList');if(invoices.length){tbody.innerHTML=invoices.map(inv=>`<tr><td style="padding:12px;border-bottom:1px solid #30363d">${inv.invoice_number||'INV-'}</td><td style="padding:12px;border-bottom:1px solid #30363d">${formatDate(inv.created_at)}</td><td style="padding:12px;border-bottom:1px solid #30363d">₹${(inv.total_amount||0).toFixed(2)}</td><td style="padding:12px;border-bottom:1px solid #30363d"><span style="background:${inv.payment_status==='paid'?'#10b981':'#f59e0b'};color:white;padding:4px 8px;border-radius:4px;font-size:12px">${inv.payment_status||'pending'}</span></td></tr>`).join('')}else{tbody.innerHTML='<tr><td colspan="4" style="padding:20px;text-align:center;color:#8b949e">No invoices yet</td></tr>'}})()}window.addEventListener('DOMContentLoaded',loadDashboard)</script></body></html>
