<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Harbour - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --success-green: #10b981;
            --success-light: #d1fae5;
            --error-red: #ef4444;
            --error-light: #fee2e2;
            --gray: #6b7280;
            --gray-light: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-light) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(40px);
        }

        .blob1 {
            width: 300px;
            height: 300px;
            background: white;
            top: -100px;
            left: -100px;
        }

        .blob2 {
            width: 200px;
            height: 200px;
            background: white;
            bottom: -100px;
            right: -100px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            max-width: 1200px;
            width: 100%;
            gap: 40px;
            align-items: center;
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .hero {
            color: white;
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .hero {
                display: none;
            }
        }

        .logo {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .services {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .service-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .service-item:hover {
            transform: translateX(10px);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--gray);
            font-size: 14px;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gray-light);
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            transition: all 0.4s ease;
        }

        .step.active .step-number {
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 0 0 8px rgba(30, 64, 175, 0.2);
        }

        .step.completed .step-number {
            background: var(--success-green);
            color: white;
        }

        .step-label {
            font-weight: 600;
            font-size: 14px;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .step.active .step-label {
            color: var(--primary-blue);
        }

        .step-line {
            flex: 1;
            height: 2px;
            background: var(--gray-light);
            margin-top: 8px;
            transition: background 0.4s;
        }

        .step-line.completed {
            background: var(--success-green);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--gray);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--gray-light);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
            color: #000;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
            transform: translateY(-2px);
        }

        .form-group input:valid:not(:placeholder-shown) {
            border-color: var(--success-green);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(30, 64, 175, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--gray);
        }

        .btn-secondary:hover {
            background: var(--primary-light);
            color: white;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .alert.show {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-error {
            background: var(--error-light);
            color: var(--error-red);
            border: 1px solid var(--error-red);
        }

        .alert-success {
            background: var(--success-light);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--gray);
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-light);
        }
    </style>
</head>
<body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="container">
        <div class="hero">
            <div class="logo">🚢</div>
            <h1>Dream Harbour</h1>
            <p>Secure, Fast & Reliable Invoicing</p>
            <div class="services">
                <div class="service-item"><span>✓ Instant Invoicing</span></div>
                <div class="service-item"><span>✓ Secure Payments</span></div>
                <div class="service-item"><span>✓ Real-time Tracking</span></div>
            </div>
        </div>

        <div class="form-container">
            <div class="form-header">
                <h2>Sign In</h2>
                <p>Two-step verification for security</p>
            </div>

            <div class="step-indicator">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <span class="step-label">Phone</span>
                </div>
                <div class="step-line" id="stepLine"></div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <span class="step-label">PIN</span>
                </div>
            </div>

            <div id="alertContainer"></div>

            <form id="phoneForm" class="form-step active">
                <div class="form-group">
                    <label for="phoneInput">Phone Number</label>
                    <input type="tel" id="phoneInput" placeholder="10-digit mobile number" maxlength="10" pattern="[0-9]{10}" inputmode="numeric" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Next</button>
                </div>
            </form>

            <form id="pinForm" class="form-step" style="display: none;">
                <div class="form-group">
                    <label for="pinInput">Security PIN</label>
                    <input type="password" id="pinInput" placeholder="6-digit PIN" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-secondary" id="backBtn">Back</button>
                    <button type="submit" class="btn-primary" id="pinSubmitBtn">Sign In</button>
                </div>
            </form>

            <div class="security-badge">
                <span>🔒</span>
                <span>Your data is encrypted and secure</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentPhone = '';

        // Phone Form Submit
        document.getElementById('phoneForm').addEventListener('submit', function(e) {
            e.preventDefault();
            currentPhone = document.getElementById('phoneInput').value;
            
            if (!/^\d{10}$/.test(currentPhone)) {
                showAlert('Phone number must be exactly 10 digits', 'error');
                return;
            }

            proceedToStep2();
        });

        // PIN Form Submit
        document.getElementById('pinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pin = document.getElementById('pinInput').value;
            
            if (!/^\d{6}$/.test(pin)) {
                showAlert('PIN must be exactly 6 digits', 'error');
                return;
            }

            await authenticateUser(currentPhone, pin);
        });

        // Authenticate User from users table
        async function authenticateUser(phoneNumber, pin) {
            const btn = document.getElementById('pinSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                // Query users table with phone_number and pin
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('phone_number', phoneNumber)
                    .eq('pin', pin)
                    .eq('is_active', true)
                    .limit(1)
                    .single();

                if (error || !data) {
                    showAlert('Invalid phone number or PIN', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    return;
                }

                // Store user info in localStorage
                localStorage.setItem('user', JSON.stringify({
                    id: data.id,
                    phone_number: data.phone_number,
                    full_name: data.full_name,
                    role: data.role,
                    timestamp: Date.now()
                }));

                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } catch (error) {
                console.error('Error:', error);
                showAlert('Connection error. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        function proceedToStep2() {
            document.getElementById('phoneForm').style.display = 'none';
            document.getElementById('pinForm').style.display = 'block';
            document.getElementById('step1').classList.add('completed');
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('stepLine').classList.add('completed');
            document.getElementById('pinInput').focus();
        }

        document.getElementById('backBtn').addEventListener('click', function() {
            document.getElementById('pinForm').style.display = 'none';
            document.getElementById('phoneForm').style.display = 'block';
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('step1').classList.remove('completed');
            document.getElementById('stepLine').classList.remove('completed');
            document.getElementById('pinInput').value = '';
            document.getElementById('phoneInput').focus();
        });

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert show alert-${type}`;
            alertDiv.innerHTML = `<span>${type === 'error' ? '❌' : '✅'}</span><span>${message}</span>`;
            container.innerHTML = '';
            container.appendChild(alertDiv);
        }
    </script>
</body>
</html>
