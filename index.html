<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamHarbour - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <div class="container">
        <!-- HERO SECTION (Left Side) -->
        <div class="hero">
            <div class="hero-content">
                <div class="logo-container">
                    <!-- You can add a logo image here if you have one -->
                    <span class="logo-text">DreamHarbour</span>
                </div>
                <span class="tagline">Business Dashboard</span>
            </div>
        </div>
        <!-- FORM SECTION (Right Side Login Card) -->
        <div class="form-section">
            <div class="form-header">
                <h1>Sign In</h1>
                <p>Enter your details to access the dashboard</p>
            </div>

            <!-- Error Messages -->
            <div id="step1Error" class="error-message"></div>
            <div id="step2Error" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <!-- Step 1: Phone Number Entry -->
            <form id="step1Form" class="step-form active">
                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input 
                        type="text" 
                        id="phoneNumber" 
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        class="form-input"
                    >
                    <div id="phoneValidation" class="validation-feedback"></div>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember Me</label>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Next</button>
            </form>

            <!-- Step 2: PIN Entry -->
            <form id="step2Form" class="step-form inactive">
                <div class="form-group">
                    <label for="pin">PIN</label>
                    <input 
                        type="password" 
                        id="pin" 
                        placeholder="Enter 6-digit PIN"
                        maxlength="6"
                        class="form-input"
                    >
                    <div id="pinValidation" class="validation-feedback"></div>
                </div>
                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="backStep()">Back</button>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>

            <!-- Step Indicators -->
            <div class="step-indicators">
                <div id="step1Indicator" class="step-indicator active">1</div>
                <div class="step-line"></div>
                <div id="step2Indicator" class="step-indicator">2</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <!-- Form Event Listeners -->
    <script>
        document.getElementById('step1Form').addEventListener('submit', nextStep);
        document.getElementById('step2Form').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
