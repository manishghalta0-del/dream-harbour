<!-- Dream Harbour - Professional Login System -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dream Harbour - Professional Invoice Management System">
    <meta name="theme-color" content="#667eea">
    <title>Dream Harbour - Login</title>
    <!-- Load configuration first -->
    <script src="config.js"></script>
    <!-- Initialize Supabase -->
    <script src="supabase-init.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .bg-blur {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .bg-blur-1 {
            top: -100px;
            right: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .bg-blur-2 {
            bottom: -150px;
            left: -100px;
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0px, 0px); }
            50% { transform: translate(30px, 30px); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px 45px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 56px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4));
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4)); }
            50% { filter: drop-shadow(0 0 30px rgba(102, 126, 234, 0.7)); }
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2), inset 0 0 20px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            font-size: 12px;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .error.show {
            display: block;
        }

        .success {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.15);
            border: 1px solid rgba(81, 207, 102, 0.3);
        }

        .success.show {
            display: block;
        }

        .info {
            background: rgba(102, 126, 234, 0.15);
            color: rgba(102, 126, 234, 0.9);
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .info.show {
            display: block;
        }

        .demo-credentials {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .demo-credentials strong {
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 40px 25px;
                margin: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>

    <div class="login-container">
        <div class="logo">🏛️</div>
        <h1>Dream Harbour</h1>
        <p class="subtitle">Invoice Management System</p>

        <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
                <label for="phone">Phone Number (10 digits)</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="Enter your 10-digit phone number" 
                    maxlength="10" 
                    inputmode="numeric" 
                    autocomplete="off"
                    required>
            </div>

            <div class="form-group">
                <label for="pin">PIN (6 digits)</label>
                <input 
                    type="password" 
                    id="pin" 
                    name="pin" 
                    placeholder="Enter your 6-digit PIN" 
                    maxlength="6" 
                    inputmode="numeric" 
                    autocomplete="off"
                    required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div id="info" class="message info"></div>
        <div id="error" class="message error"></div>
        <div id="success" class="message success"></div>

        <div class="demo-credentials">
            <strong>Demo Credentials:</strong><br>
            Phone: <strong>9999999999</strong> PIN: <strong>123456</strong>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        'use strict';

        /**
         * Get configuration with fallbacks
         */
        function getConfig() {
            return typeof APP_CONFIG !== 'undefined' ? APP_CONFIG : {
                VALIDATION: {
                    PHONE_PATTERN: /^\d{10}$/,
                    PIN_PATTERN: /^\d{6}$/
                },
                ERRORS: {
                    INVALID_PHONE: 'Please enter a valid 10-digit phone number',
                    INVALID_PIN: 'Please enter a valid 6-digit PIN'
                },
                SUCCESS: {
                    LOGIN: 'Login successful! Redirecting...'
                }
            };
        }

        /**
         * Initialize login page
         */
        async function initializePage() {
            console.log('🚀 Initializing login page...');

            try {
                // Wait for Supabase to be ready
                const maxAttempts = 30;
                let attempts = 0;
                
                while (attempts < maxAttempts && !isSupabaseReady()) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!isSupabaseReady()) {
                    console.warn('⚠️ Supabase not ready, but continuing with login...');
                }

                console.log('✅ Page initialized successfully');
                hideMessage('info');
                showMessage('info', '✅ Ready to login.');
            } catch (error) {
                console.error('❌ Initialization error:', error);
                showMessage('error', '❌ Failed to initialize. Please refresh the page.');
            }
        }

        /**
         * Show message to user
         */
        function showMessage(type, message) {
            const element = document.getElementById(type);
            if (element) {
                element.textContent = message;
                element.classList.add('show');
            }
        }

        /**
         * Hide message
         */
        function hideMessage(type) {
            const element = document.getElementById(type);
            if (element) {
                element.textContent = '';
                element.classList.remove('show');
            }
        }

        /**
         * Handle login form submission
         */
        async function handleLogin(event) {
            event.preventDefault();
            console.log('🔐 Login attempt started');

            const config = getConfig();
            const phone = document.getElementById('phone').value.trim();
            const pin = document.getElementById('pin').value.trim();
            const submitBtn = event.target.querySelector('button[type="submit"]');

            // Clear messages
            hideMessage('error');
            hideMessage('success');
            hideMessage('info');

            // Validate inputs
            if (!phone || !config.VALIDATION.PHONE_PATTERN.test(phone)) {
                showMessage('error', config.ERRORS.INVALID_PHONE);
                console.error('Invalid phone format');
                return;
            }

            if (!pin || !config.VALIDATION.PIN_PATTERN.test(pin)) {
                showMessage('error', config.ERRORS.INVALID_PIN);
                console.error('Invalid PIN format');
                return;
            }

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Logging in...';
            console.log(`📱 Attempting login with phone: ${phone}`);

            try {
                // Get Supabase client
                const supabase = await getSupabaseClient();
                console.log('📊 Querying users table...');

                // Query for user
                const { data, error } = await supabase
                    .from('users')
                    .select('id, phone_number, full_name, role, is_active')
                    .eq('phone_number', phone)
                    .eq('pin', pin)
                    .eq('is_active', true)
                    .single();

                if (error) {
                    const errorMsg = error.code === 'PGRST116' 
                        ? '❌ Invalid phone number or PIN. Please try again.'
                        : `❌ Database error: ${error.message}`;
                    
                    console.error('Query error:', error);
                    showMessage('error', errorMsg);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                    return;
                }

                if (!data) {
                    showMessage('error', '❌ Invalid phone number or PIN. Please try again.');
                    console.error('No user found with provided credentials');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                    return;
                }

                console.log(`✅ User found: ${data.full_name}`);

                // Save user session
                const userData = {
                    id: data.id,
                    phoneNumber: data.phone_number,
                    fullName: data.full_name,
                    role: data.role,
                    loginTime: Date.now()
                };

                saveUserSession(userData);
                console.log('💾 User data saved to session');

                // Show success and redirect
                showMessage('success', '✅ ' + (config.SUCCESS.LOGIN || 'Login successful! Redirecting...'));

                setTimeout(() => {
                    console.log('🔄 Redirecting to dashboard');
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Unexpected error:', error);
                showMessage('error', `❌ An error occurred: ${error.message}`);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        }

        // Initialize on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            initializePage();
        }
    </script>
</body>
</html>
