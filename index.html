<!-- Dream Harbour - Enhanced Login Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Harbour - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 48px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            color: #388e3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .success.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🏛️</div>
        <h1>Dream Harbour</h1>
        <p class="subtitle">Invoice Management System</p>

        <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
                <label for="phone">Phone Number (10 digits)</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your 10-digit phone number" maxlength="10" inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label for="pin">PIN (6 digits)</label>
                <input type="password" id="pin" name="pin" placeholder="Enter your 6-digit PIN" maxlength="6" inputmode="numeric" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
    </div>

    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        function initializeApp() {
            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                setTimeout(initializeApp, 100);
                return;
            }

            const SUPABASE_URL = 'https://lqrewteclbexiknvhenk.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxcmV3dGVjbGJleGlrbnZoZW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0NjQ2MDMsImV4cCI6MjA3NzA0MDYwM30.YLKmzuy3tfa9S09fzk4lYphBcl6a1jkeur3hUBaAHO8';
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            window.handleLogin = async function(event) {
                event.preventDefault();

                const phone = document.getElementById('phone').value.trim();
                const pin = document.getElementById('pin').value.trim();
                const errorEl = document.getElementById('error');
                const successEl = document.getElementById('success');
                const submitBtn = document.querySelector('button[type="submit"]');

                errorEl.textContent = '';
                errorEl.classList.remove('show');
                successEl.textContent = '';
                successEl.classList.remove('show');

                if (!phone || phone.length !== 10) {
                    errorEl.textContent = 'Please enter a valid 10-digit phone number';
                    errorEl.classList.add('show');
                    return;
                }

                if (!pin || pin.length !== 6) {
                    errorEl.textContent = 'Please enter a valid 6-digit PIN';
                    errorEl.classList.add('show');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in...';

                try {
                    const { data, error } = await supabase
                        .from('users')
                        .select('id, phone_number, full_name, role, is_active')
                        .eq('phone_number', phone)
                        .eq('pin', pin)
                        .eq('is_active', true)
                        .single();

                    if (error || !data) {
                        errorEl.textContent = 'Invalid phone number or PIN. Please try again.';
                        errorEl.classList.add('show');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Login';
                        return;
                    }

                    const userData = {
                        id: data.id,
                        phoneNumber: data.phone_number,
                        fullName: data.full_name,
                        role: data.role,
                        loginTime: Date.now()
                    };

                    localStorage.setItem('dreamHarbourUser', JSON.stringify(userData));
                    localStorage.setItem('dreamHarbourLoginTime', Date.now().toString());

                    successEl.textContent = 'Login successful! Redirecting...';
                    successEl.classList.add('show');

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);

                } catch (error) {
                    console.error('Login error:', error);
                    errorEl.textContent = 'An error occurred. Please try again.';
                    errorEl.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
