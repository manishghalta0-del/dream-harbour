<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign In — DreamHarbour</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <main class="content">
      <section class="card" style="max-width:520px;margin:40px auto;">
        <div class="card__header"><h2>Sign in</h2></div>
        <div class="card__body">
          <form id="step1Form">
            <div class="form-group">
              <label class="form-label" for="phoneNumber">Phone number</label>
              <input id="phoneNumber" class="form-control" type="text" maxlength="10" placeholder="10-digit mobile" />
              <div id="phoneValidation" class="validation-feedback"></div>
            </div>
            <div class="form-group">
              <label><input id="rememberMe" type="checkbox"> Remember this phone</label>
            </div>
            <div class="form-group">
              <button id="startPinBtn" class="btn btn--primary">Continue</button>
            </div>
          </form>

          <form id="step2Form" class="hidden">
            <div class="form-group">
              <label class="form-label" for="pin">Enter PIN</label>
              <input id="pin" class="form-control" type="password" maxlength="6" />
              <div id="pinValidation" class="validation-feedback"></div>
            </div>
            <div class="form-group">
              <button class="btn btn--primary" type="submit">Sign In</button>
              <button type="button" id="backToPhone" class="btn btn--outline">Back</button>
            </div>
            <div id="step2Error" class="validation-feedback"></div>
            <div id="successMessage" class="dh-muted"></div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/notifications.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.initAuthPage) window.initAuthPage();
    });
  </script>
</body>
</html>
