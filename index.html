<!-- Dream Harbour - Modern Login Design (Same Supabase Flow) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Harbour - Login</title>
    <script src="supabase-init.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .bg-blur {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .bg-blur-1 {
            top: -100px;
            right: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .bg-blur-2 {
            bottom: -150px;
            left: -100px;
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0px, 0px); }
            50% { transform: translate(30px, 30px); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px 45px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 56px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4));
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.4)); }
            50% { filter: drop-shadow(0 0 30px rgba(102, 126, 234, 0.7)); }
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(102, 126, 234, 0.6);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2), inset 0 0 20px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            font-size: 12px;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .error.show {
            display: block;
        }

        .success {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.15);
            border: 1px solid rgba(81, 207, 102, 0.3);
        }

        .success.show {
            display: block;
        }

        .info {
            background: rgba(102, 126, 234, 0.15);
            color: rgba(102, 126, 234, 0.9);
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .info.show {
            display: block;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 40px 25px;
                margin: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>

    <div class="login-container">
        <div class="logo">🏛️</div>
        <h1>Dream Harbour</h1>
        <p class="subtitle">Invoice Management System</p>

        <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
                <label for="phone">Phone Number (10 digits)</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your 10-digit phone number" maxlength="10" inputmode="numeric" required>
            </div>

            <div class="form-group">
                <label for="pin">PIN (6 digits)</label>
                <input type="password" id="pin" name="pin" placeholder="Enter your 6-digit PIN" maxlength="6" inputmode="numeric" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <div id="info" class="message info"></div>
        <div id="error" class="message error"></div>
        <div id="success" class="message success"></div>
    </div>

    <!-- NOTE: Supabase library is loaded by supabase-init.js, NO duplicate script tag needed here -->
    <script>
        // NOTE: 'supabase' is provided globally by supabase-init.js
        // Wait for it to be initialized
        
        async function waitForSupabase() {
            // Wait for supabase-init.js to initialize
            let attempts = 0;
            while (attempts < 50) {
                if (typeof getSupabaseClient === 'function') {
                    try {
                        const client = await getSupabaseClient();
                        if (client) {
                            console.log('✅ Supabase client ready from supabase-init.js');
                            document.getElementById('info').textContent = '✅ Ready to login.';
                            document.getElementById('info').classList.add('show');
                            return client;
                        }
                    } catch (e) {
                        console.error('Error getting Supabase client:', e);
                    }
                }
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            throw new Error('Supabase initialization timeout');
        }

        async function initializeApp() {
            console.log('✅ Initializing login page...');

            try {
                await waitForSupabase();
            } catch (error) {
                console.error('❌ Failed to initialize:', error);
                document.getElementById('error').textContent = '❌ Failed to initialize. Please refresh the page.';
                document.getElementById('error').classList.add('show');
                return;
            }

            window.handleLogin = async function(event) {
                event.preventDefault();
                console.log('🔐 Login attempt started');

                const phone = document.getElementById('phone').value.trim();
                const pin = document.getElementById('pin').value.trim();
                const errorEl = document.getElementById('error');
                const successEl = document.getElementById('success');
                const infoEl = document.getElementById('info');
                const submitBtn = document.querySelector('button[type="submit"]');

                errorEl.textContent = '';
                errorEl.classList.remove('show');
                successEl.textContent = '';
                successEl.classList.remove('show');
                infoEl.textContent = '';
                infoEl.classList.remove('show');

                if (!phone || phone.length !== 10) {
                    const msg = 'Please enter a valid 10-digit phone number';
                    console.error(msg);
                    errorEl.textContent = msg;
                    errorEl.classList.add('show');
                    return;
                }

                if (!pin || pin.length !== 6) {
                    const msg = 'Please enter a valid 6-digit PIN';
                    console.error(msg);
                    errorEl.textContent = msg;
                    errorEl.classList.add('show');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in...';
                console.log(`📱 Attempting login with phone: ${phone}`);

                try {
                    const supabase = await getSupabaseClient();
                    console.log('📊 Querying users table...');
                    
                    const { data, error } = await supabase
                        .from('users')
                        .select('id, phone_number, full_name, role, is_active')
                        .eq('phone_number', phone)
                        .eq('pin', pin)
                        .eq('is_active', true)
                        .single();

                    if (error) {
                        console.error(`❌ Supabase query error: ${JSON.stringify(error)}`);
                        errorEl.textContent = `❌ Database error: ${error.message}\n\nPlease check:\n1. Users table exists\n2. Test user exists with this phone/PIN\n3. Supabase credentials are correct`;
                        errorEl.classList.add('show');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Login';
                        return;
                    }

                    if (!data) {
                        console.error('❌ No user found with provided credentials');
                        errorEl.textContent = '❌ Invalid phone number or PIN. Please try again.\n\nIf you just created the user, make sure:\n- Phone number is correct (10 digits)\n- PIN is correct (6 digits)\n- is_active field is TRUE';
                        errorEl.classList.add('show');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Login';
                        return;
                    }

                    console.log(`✅ User found: ${data.full_name}`);

                    const userData = {
                        id: data.id,
                        phoneNumber: data.phone_number,
                        fullName: data.full_name,
                        role: data.role,
                        loginTime: Date.now()
                    };

                    localStorage.setItem('dreamHarbourUser', JSON.stringify(userData));
                    localStorage.setItem('dreamHarbourLoginTime', Date.now().toString());
                    console.log('💾 User data saved to localStorage');

                    successEl.textContent = '✅ Login successful! Redirecting to dashboard...';
                    successEl.classList.add('show');

                    setTimeout(() => {
                        console.log('🔄 Redirecting to dashboard');
                        window.location.href = 'dashboard.html';
                    }, 1500);

                } catch (error) {
                    console.error(`❌ Unexpected error: ${error.message}\n${error.stack}`);
                    errorEl.textContent = `❌ An error occurred: ${error.message}\n\nCheck the console for details.`;
                    errorEl.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
