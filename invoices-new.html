<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoices - Dream Harbour</title><link rel="stylesheet" href="styles.css"><style>.invoice-form{background:rgba(33,38,45,0.6);border:1px solid #30363d;border-radius:12px;padding:24px;backdrop-filter:blur(10px);margin-bottom:24px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.invoice-items{background:rgba(33,38,45,0.6);border:1px solid #30363d;border-radius:12px;padding:16px;margin:24px 0}.item-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:12px;margin-bottom:12px;align-items:center}.totals{background:rgba(0,0,0,0.3);padding:16px;border-radius:8px;margin-top:16px;display:grid;grid-template-columns:200px 1fr;gap:32px}.total-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #30363d}.total-amount{font-size:24px;font-weight:700;color:#8b5cf6;text-align:right}</style></head><body><nav class="navbar"><div class="navbar-brand">🏛️ Dream Harbour</div><div class="navbar-user"><span id="userName">Loading...</span><button style="background:#ef4444;color:white;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:600" onclick="logout()">Logout</button></div></nav><aside class="sidebar"><a href="dashboard-new.html" class="sidebar-item">📊 Dashboard</a><a href="invoices-new.html" class="sidebar-item active">📄 Invoices</a><a href="settings-new.html" class="sidebar-item">⚙️ Settings</a></aside><main class="main-content"><h1>Create Invoice</h1><div class="invoice-form"><div class="form-row"><div class="form-group"><label>Category</label><select id="categorySelect" onchange="updateServices()" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"><option>Select Category...</option></select></div><div class="form-group"><label>Service</label><select id="serviceSelect" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"><option>Select Service...</option></select></div></div><div class="form-row"><div class="form-group"><label>Quantity</label><input type="number" id="quantity" value="1" min="1" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div><div class="form-group"><label>Rate</label><input type="number" id="rate" value="0" min="0" step="0.01" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div></div><button onclick="addItem()" class="btn btn-primary">Add Item</button></div><div class="invoice-items"><h3>Invoice Items</h3><div id="itemsList"></div><div class="totals"><div><div class="total-line"><span>Subtotal:</span><span id="subtotal">₹0.00</span></div><div class="total-line"><span>Total GST:</span><span id="totalGST">₹0.00</span></div><div class="total-line" style="border:none;font-size:18px;font-weight:700"><span>Total Amount:</span><span id="totalAmount" class="total-amount">₹0.00</span></div></div><div><button onclick="saveInvoice()" class="btn btn-success" style="width:100%;padding:12px;font-size:16px">Save Invoice</button></div></div></div></main><div id="debug-console" style="position:fixed;bottom:0;right:0;width:400px;max-height:150px;background:rgba(15,17,23,0.95);border:1px solid #30363d;border-bottom:none;border-right:none;overflow-y:auto;padding:12px;font-family:monospace;font-size:11px;z-index:1000;color:#8b949e"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>let items=[];function logout(){clearUserSession();window.location.href='index.html'}async function loadCategories(){const user=getUserSession();if(!user){window.location.href='index.html';return}document.getElementById('userName').textContent=user.full_name;const cats=await fetchCategories();const select=document.getElementById('categorySelect');cats.forEach(c=>{const opt=document.createElement('option');opt.value=c.id;opt.textContent=c.category_name;select.appendChild(opt)})}async function updateServices(){const catId=document.getElementById('categorySelect').value;if(!catId)return;const services=await fetchServicesByCategory(catId);const select=document.getElementById('serviceSelect');select.innerHTML='<option>Select Service...</option>';services.forEach(s=>{const opt=document.createElement('option');opt.value=JSON.stringify({id:s.id,name:s.service_name,sac:s.sac_code,gst:s.default_gst_percentage});opt.textContent=s.service_name;select.appendChild(opt)})}function addItem(){const qty=parseFloat(document.getElementById('quantity').value);const rate=parseFloat(document.getElementById('rate').value);const serviceStr=document.getElementById('serviceSelect').value;if(!serviceStr||qty<1||rate<0){showToast('Fill all fields','error');return}const service=JSON.parse(serviceStr);const amount=qty*rate;const gst=calculateGST(amount,service.gst||0);items.push({service:service.name,sac:service.sac,qty,rate,amount,gst,total:amount+gst});updateDisplay();document.getElementById('quantity').value='1';document.getElementById('rate').value='0'}function updateDisplay(){const list=document.getElementById('itemsList');list.innerHTML=items.map((it,i)=>`<div class="item-row"><div>${it.service}</div><div>${it.qty}</div><div>₹${it.rate.toFixed(2)}</div><div>₹${it.amount.toFixed(2)} (${it.gst>0?'18% GST':'No GST'})</div><div>₹${it.total.toFixed(2)}</div><button onclick="removeItem(${i})" style="background:#ef4444;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer">Remove</button></div>`).join('');const subtotal=items.reduce((s,it)=>s+it.amount,0);const gstTotal=items.reduce((s,it)=>s+it.gst,0);const total=subtotal+gstTotal;document.getElementById('subtotal').textContent=formatCurrency(subtotal);document.getElementById('totalGST').textContent=formatCurrency(gstTotal);document.getElementById('totalAmount').textContent=formatCurrency(total)}function removeItem(i){items.splice(i,1);updateDisplay()}async function saveInvoice(){if(!items.length){showToast('Add items first','error');return}const subtotal=items.reduce((s,it)=>s+it.amount,0);const gst=items.reduce((s,it)=>s+it.gst,0);const total=subtotal+gst;const user=getUserSession();try{showLoader(true);const invData={invoice_number:'INV-'+new Date().getTime(),created_by:user.id,invoice_date:new Date().toISOString(),subtotal,total_gst:gst,total_amount:total,payment_status:'pending'};const inv=await saveInvoice(invData);showToast('Invoice saved successfully','success');items=[];updateDisplay();showLoader(false)}catch(e){showToast('Error: '+e.message,'error');showLoader(false)}}window.addEventListener('DOMContentLoaded',loadCategories)</script></body></html>
