<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard — DreamHarbour</title>

  <!-- CSS order matters: tokens/vars -> base styles -> theme -> dashboard -> responsive -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="dh-container">
    <header class="dh-header">
      <div class="dh-header__left">
        <a class="dh-logo" href="dashboard.html">DreamHarbour</a>
        <div class="dh-user">Signed in as <strong id="userName">—</strong> <span id="userRole" class="dh-muted">—</span></div>
      </div>

      <div class="dh-actions">
        <!-- Buttons used by dashboard.js -->
        <button id="btnRefresh" class="btn btn--sm" aria-label="Refresh">⟳</button>
        <button id="btnExport"  class="btn btn--sm" aria-label="Export">⤓</button>
        <button id="btnLogout"  class="btn btn--sm btn--outline" aria-label="Logout">Log out</button>
      </div>
    </header>

    <main class="dh-grid content" role="main">
      <!-- Stats panel -->
      <section class="dh-card dh-panel--lg">
        <div class="dh-card__header">
          <div class="dh-card__title">Overview</div>
          <div class="dh-muted">Summary</div>
        </div>
        <div class="dh-card__body">
          <div class="dh-stats">
            <div class="dh-stat">
              <div class="dh-stat__value" id="statInvoices">—</div>
              <div class="dh-stat__label">Invoices</div>
            </div>
            <div class="dh-stat">
              <div class="dh-stat__value" id="statRevenue">—</div>
              <div class="dh-stat__label">Revenue</div>
            </div>
            <div class="dh-stat">
              <div class="dh-stat__value" id="statPending">—</div>
              <div class="dh-stat__label">Pending</div>
            </div>
            <div class="dh-stat">
              <div class="dh-stat__value" id="statCustomers">—</div>
              <div class="dh-stat__label">Customers</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Recent invoices panel -->
      <section class="dh-card dh-panel--md">
        <div class="dh-card__header">
          <div class="dh-card__title">Recent invoices</div>
        </div>
        <div class="dh-card__body">
          <table class="dh-table" aria-describedby="recentInvoices">
            <thead>
              <tr>
                <th>Invoice #</th>
                <th>Amount</th>
                <th>GST</th>
                <th>Status</th>
                <th>Date</th>
                <th class="td-actions">Actions</th>
              </tr>
            </thead>
            <tbody id="recentInvoicesBody">
              <!-- Populated by js/dashboard.js -->
              <tr><td colspan="6" class="dh-muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Top services -->
      <aside class="dh-card dh-panel--sm">
        <div class="dh-card__header">
          <div class="dh-card__title">Top services</div>
        </div>
        <div class="dh-card__body">
          <ul id="topServices" class="dh-top-services">
            <!-- Populated by js/dashboard.js -->
            <li class="dh-muted">Loading…</li>
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <!-- scripts: common + notifications + dashboard runtime -->
  <script src="/js/common.js"></script>
  <script src="/js/notifications.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
