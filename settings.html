<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Settings — DreamHarbour</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <a class="logo" href="dashboard.html">DreamHarbour</a>
      <div class="header-right">
        <div id="userName" class="dh-muted">—</div>
        <button id="btnLogout" class="btn btn--sm btn--outline">Logout</button>
      </div>
    </header>

    <main class="content">
      <div class="card">
        <div class="card__header">
          <div>
            <button class="tab-btn active" onclick="switchTab('business', this)">Business</button>
            <button class="tab-btn" onclick="switchTab('services', this)">Services</button>
            <button class="tab-btn" onclick="switchTab('categories', this)">Categories</button>
          </div>
        </div>

        <div class="card__body">
          <!-- Business tab -->
          <div id="businessTab" class="tab-content active">
            <form id="businessSettingsForm">
              <div class="form-group">
                <label class="form-label" for="businessName">Business name</label>
                <input id="businessName" class="form-control" type="text" />
              </div>
              <div class="form-group">
                <label class="form-label" for="gstPercentage">Default GST %</label>
                <input id="gstPercentage" class="form-control" type="number" value="18"/>
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn--primary">Save settings</button>
              </div>
            </form>
          </div>

          <!-- Services tab -->
          <div id="servicesTab" class="tab-content">
            <form id="addServiceForm">
              <div class="form-group">
                <label class="form-label" for="serviceName">Service name</label>
                <input id="serviceName" class="form-control" type="text" />
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn--primary">Add service</button>
              </div>
            </form>
          </div>

          <!-- Categories tab -->
          <div id="categoriesTab" class="tab-content">
            <form id="addCategoryForm">
              <div class="form-group">
                <label class="form-label" for="categoryName">Category name</label>
                <input id="categoryName" class="form-control" type="text" />
              </div>
              <div class="form-group">
                <button type="submit" class="btn btn--primary">Add category</button>
              </div>
            </form>

            <div id="categoriesList" class="dh-space-top">
              <!-- categories populated by settings.js -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/notifications.js"></script>
  <script type="module" src="/js/settings.js"></script>
  <script>
    // Tab switcher: pass the clicked button as second arg to avoid missing event
    function switchTab(tabName, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      const sel = document.getElementById(tabName + 'Tab');
      if (sel) sel.classList.add('active');
      if (btn) btn.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (window.initializeSettings) {
        await window.initializeSettings();
      } else {
        // fallback compatibility
        window.loadBusinessSettings && window.loadBusinessSettings();
        window.loadServiceCategories && window.loadServiceCategories();
      }

      // Wire logout fallback (if not provided by common)
      document.getElementById('btnLogout')?.addEventListener('click', () => {
        if (confirm('Logout?')) {
          localStorage.removeItem('dreamHarbourUser'); localStorage.removeItem('userSession');
          window.location.href = 'index.html';
        }
      });
    });
  </script>
</body>
</html>
