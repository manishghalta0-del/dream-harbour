<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dream Harbour - Customers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --primary-dark: #5568d3;
            --light-bg: #f8f9fa;
            --white: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --border-color: #e0e0e0;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.12);
        }

        html {
            overflow: hidden;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--light-bg);
            color: var(--text-primary);
            overflow: hidden;
            height: 100%;
        }

        .customers-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: var(--white);
            padding: 25px 20px;
            position: fixed;
            height: 100vh;
            width: 260px;
            overflow-y: auto;
            z-index: 100;
            top: 0;
            left: 0;
            box-shadow: var(--shadow-md);
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar-logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sidebar-subtitle {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 6px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--white);
            transform: translateX(4px);
        }

        .nav-link.active {
            background: var(--primary-color);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .nav-link span {
            font-size: 18px;
        }

        .sidebar-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .user-info-label {
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .user-info-value {
            font-weight: 600;
            word-break: break-word;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--light-bg);
            overflow: hidden;
        }

        .topbar {
            background: var(--white);
            padding: 16px 25px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: var(--light-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--white);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-danger {
            background: #f44336;
            color: var(--white);
        }

        .btn-danger:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 12px;
        }

        .content-area {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            overflow-x: hidden;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .content-area::-webkit-scrollbar {
            width: 8px;
        }

        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .content-area::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .header-section {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            min-width: 200px;
        }

        .table-wrapper {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: var(--light-bg);
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        tr:hover {
            background: var(--light-bg);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            display: none;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
        }

        @media (max-width: 1024px) {
            .customers-container {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main-content {
                margin-left: 0;
                height: auto;
            }

            .content-area {
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .topbar {
                padding: 12px 15px;
            }

            .content-area {
                padding: 15px;
            }

            .header-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions button {
                flex: 1;
            }

            .filter-section {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
                min-width: auto;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 8px;
            }

            .actions {
                flex-direction: column;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="customers-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🏃</div>
                <div class="sidebar-title">Dream Harbour</div>
                <div class="sidebar-subtitle">Invoice Manager</div>
            </div>

            <div class="nav-section">
                <a href="dashboard.html" class="nav-link">
                    <span>📊</span> Overview
                </a>
                <a href="invoices.html" class="nav-link">
                    <span>📄</span> Invoices
                </a>
                <a href="customers.html" class="nav-link active">
                    <span>👥</span> Customers
                </a>
                <a href="settings.html" class="nav-link">
                    <span>⚙️</span> Settings
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-info-label">Logged in as</div>
                    <div class="user-info-value" id="userNameDisplay">User</div>
                </div>
                <button class="btn btn-danger" style="width: 100%;" onclick="logout()">
                    <span>🚪</span> Logout
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left">
                    <div class="page-title">👥 Customers</div>
                </div>

                <div class="topbar-right">
                    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="content-area">
                <div id="alertContainer"></div>

                <div class="header-section">
                    <div class="header-top">
                        <div class="header-title">Customer Management</div>
                        <div class="header-actions">
                            <button class="btn btn-primary" onclick="openAddCustomerModal()">➕ Add Customer</button>
                            <button class="btn btn-secondary" onclick="downloadExcel()">📥 Download Excel</button>
                        </div>
                    </div>
                    <div class="filter-section">
                        <input type="text" id="searchInput" class="search-box" placeholder="Search by name, email, phone, or company..." onkeyup="filterCustomers()">
                    </div>
                </div>

                <div id="loadingState" class="loading">
                    <div class="spinner"></div>
                    <div>Loading customers...</div>
                </div>

                <div id="tableState" class="table-wrapper" style="display: none;">
                    <table id="customersTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Company</th>
                                <th>Address</th>
                                <th>GSTIN</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        </tbody>
                    </table>
                </div>

                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">👥</div>
                    <div class="empty-state-text">No customers found</div>
                    <button class="btn btn-primary" onclick="openAddCustomerModal()">Add First Customer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Customer Modal -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">➕ Add Customer</span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="customerName" placeholder="Enter full name" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="customerEmail" placeholder="Enter email" required>
            </div>
            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" id="customerMobileNo" placeholder="Enter mobile number" required pattern="[0-9]{10}">
            </div>
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="customerCompany" placeholder="Enter company name">
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="customerAddress" rows="2" placeholder="Enter complete address"></textarea>
            </div>
            <div class="form-group">
                <label>GSTIN</label>
                <input type="text" id="customerGstin" placeholder="Enter GSTIN (optional)">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveCustomer()">💾 Save Customer</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabase;
        let allCustomers = [];
        let filteredCustomers = [];
        let editingCustomerId = null;

        function initializeApp() {
            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                setTimeout(initializeApp, 100);
                return;
            }

            const user = localStorage.getItem('dreamHarbourUser');
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const userData = JSON.parse(user);
                document.getElementById('userNameDisplay').textContent = userData.fullName || 'User';
            } catch (e) {
                console.error('Error parsing user data:', e);
            }

            const SUPABASE_URL = 'https://lqrewteclbexiknvhenk.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxcmV3dGVjbGJleGlrbnZoZW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0NjQ2MDMsImV4cCI6MjA3NzA0MDYwM30.YLKmzuy3tfa9S09fzk4lYphBcl6a1jkeur3hUBaAHO8';
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            loadCustomers();
        }

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            const alertDiv = document.createElement('div');
            alertDiv.id = alertId;
            alertDiv.className = `alert ${type}`;
            alertDiv.textContent = message;
            alertContainer.appendChild(alertDiv);
            
            setTimeout(() => {
                const el = document.getElementById(alertId);
                if (el) el.remove();
            }, 5000);
        }

        async function loadCustomers() {
            try {
                const { data, error } = await supabase
                    .from('customers')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allCustomers = data || [];
                filteredCustomers = [...allCustomers];
                renderCustomers();
            } catch (error) {
                console.error('Error loading customers:', error);
                showAlert('Error loading customers: ' + error.message, 'error');
            } finally {
                document.getElementById('loadingState').style.display = 'none';
            }
        }

        function renderCustomers() {
            const tableBody = document.getElementById('tableBody');
            const tableState = document.getElementById('tableState');
            const emptyState = document.getElementById('emptyState');

            if (filteredCustomers.length === 0) {
                tableState.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            tableState.style.display = 'block';
            emptyState.style.display = 'none';
            tableBody.innerHTML = '';

            filteredCustomers.forEach(customer => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${customer.full_name || '-'}</strong></td>
                    <td>${customer.email || '-'}</td>
                    <td>${customer.mobile_no || '-'}</td>
                    <td>${customer.company_name || '-'}</td>
                    <td>${customer.address || '-'}</td>
                    <td>${customer.gstin || '-'}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-sm btn-primary" onclick="editCustomer('${customer.id}')" title="Edit customer">✏️ Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCustomer('${customer.id}')" title="Delete customer">🗑️ Delete</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function filterCustomers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredCustomers = allCustomers.filter(customer => 
                (customer.full_name?.toLowerCase().includes(searchTerm)) ||
                (customer.email?.toLowerCase().includes(searchTerm)) ||
                (customer.mobile_no?.includes(searchTerm)) ||
                (customer.company_name?.toLowerCase().includes(searchTerm)) ||
                (customer.address?.toLowerCase().includes(searchTerm))
            );
            renderCustomers();
        }

        function openAddCustomerModal() {
            editingCustomerId = null;
            document.getElementById('modalTitle').textContent = '➕ Add Customer';
            document.getElementById('customerName').value = '';
            document.getElementById('customerEmail').value = '';
            document.getElementById('customerMobileNo').value = '';
            document.getElementById('customerCompany').value = '';
            document.getElementById('customerAddress').value = '';
            document.getElementById('customerGstin').value = '';
            document.getElementById('customerModal').style.display = 'block';
        }

        function editCustomer(customerId) {
            const customer = allCustomers.find(c => c.id === customerId);
            if (!customer) return;

            editingCustomerId = customerId;
            document.getElementById('modalTitle').textContent = '✏️ Edit Customer';
            document.getElementById('customerName').value = customer.full_name || '';
            document.getElementById('customerEmail').value = customer.email || '';
            document.getElementById('customerMobileNo').value = customer.mobile_no || '';
            document.getElementById('customerCompany').value = customer.company_name || '';
            document.getElementById('customerAddress').value = customer.address || '';
            document.getElementById('customerGstin').value = customer.gstin || '';
            document.getElementById('customerModal').style.display = 'block';
        }

        async function saveCustomer() {
            try {
                const name = document.getElementById('customerName').value;
                const email = document.getElementById('customerEmail').value;
                const mobileNo = document.getElementById('customerMobileNo').value;

                if (!name || !email || !mobileNo) {
                    showAlert('Please fill in required fields (Name, Email, Mobile)', 'error');
                    return;
                }

                // Validate mobile number (10 digits)
                if (!/^[0-9]{10}$/.test(mobileNo)) {
                    showAlert('Mobile number must be 10 digits', 'error');
                    return;
                }

                const normalizedMobile = mobileNo.replace(/\D/g, '');
                const company = document.getElementById('customerCompany').value || null;
                const address = document.getElementById('customerAddress').value || null;
                const gstin = document.getElementById('customerGstin').value || null;

                const customerData = {
                    full_name: name,
                    email: email,
                    mobile_no: normalizedMobile,
                    company_name: company,
                    address: address,
                    gstin: gstin
                };

                if (editingCustomerId) {
                    // Editing existing customer
                    const { error } = await supabase
                        .from('customers')
                        .update(customerData)
                        .eq('id', editingCustomerId);

                    if (error) throw error;
                    showAlert('✅ Customer updated successfully!', 'success');
                } else {
                    // Adding new customer - check if mobile already exists
                    const existingCustomer = allCustomers.find(c => String(c.mobile_no) === normalizedMobile);
                    
                    if (existingCustomer) {
                        // Mobile already exists - update with new details
                        const { error } = await supabase
                            .from('customers')
                            .update(customerData)
                            .eq('id', existingCustomer.id);

                        if (error) throw error;
                        showAlert('✅ Customer updated successfully!', 'success');
                    } else {
                        // New mobile number - insert new customer
                        const { error } = await supabase
                            .from('customers')
                            .insert([customerData]);

                        if (error) throw error;
                        showAlert('✅ Customer added successfully!', 'success');
                    }
                }

                closeModal();
                loadCustomers();
            } catch (error) {
                console.error('Error saving customer:', error);
                showAlert('Error saving customer: ' + error.message, 'error');
            }
        }

        async function deleteCustomer(customerId) {
            if (!confirm('Are you sure you want to delete this customer?')) return;

            try {
                const { error } = await supabase
                    .from('customers')
                    .delete()
                    .eq('id', customerId);

                if (error) throw error;
                showAlert('✅ Customer deleted successfully!', 'success');
                loadCustomers();
            } catch (error) {
                console.error('Error deleting customer:', error);
                showAlert('Error deleting customer: ' + error.message, 'error');
            }
        }

        function downloadExcel() {
            if (filteredCustomers.length === 0) {
                showAlert('No customers to download', 'error');
                return;
            }

            const data = filteredCustomers.map(c => ({
                'Full Name': c.full_name || '',
                'Email': c.email || '',
                'Mobile No': c.mobile_no || '',
                'Company': c.company_name || '',
                'Address': c.address || '',
                'GSTIN': c.gstin || '',
                'Created Date': new Date(c.created_at).toLocaleDateString()
            }));

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Customers');
            XLSX.writeFile(workbook, `dream-harbour-customers-${new Date().getTime()}.xlsx`);
            showAlert('✅ Excel file downloaded successfully!', 'success');
        }

        function closeModal() {
            document.getElementById('customerModal').style.display = 'none';
        }

        function logout() {
            localStorage.removeItem('dreamHarbourUser');
            localStorage.removeItem('dreamHarbourLoginTime');
            window.location.href = 'index.html';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('customerModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
