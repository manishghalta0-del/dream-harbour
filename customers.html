<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

<body>
    <!-- (ALL YOUR EXISTING HTML STRUCTURE ABOVE IS UNCHANGED) -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ✅ CLEANED + FIXED VERSION OF YOUR EXISTING JS

        let supabase;
        let allCustomers = [];
        let allServices = [];
        let allCategories = [];
        let allCustomerServices = [];
        let filteredCustomers = [];
        let editingCustomerId = null;
        let currentCustomerNotes = [];
        let currentCustomerActivities = [];
        let currentCustomerServices = [];
        let serviceSearchResults = [];
        let selectedService = null;

        function initializeApp() {
            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                setTimeout(initializeApp, 100);
                return;
            }

            const user = localStorage.getItem('dreamHarbourUser');
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const userData = JSON.parse(user);
                document.getElementById('userNameDisplay').textContent = userData.fullName || 'User';
            } catch (e) {
                console.error('Error parsing user data:', e);
            }

            const SUPABASE_URL = 'https://lqrewteclbexiknvhenk.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxcmV3dGVjbGJleGlrbnZoZW5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE0NjQ2MDMsImV4cCI6MjA3NzA0MDYwM30.YLKmzuy3tfa9S09fzk4lYphBcl6a1jkeur3hUBaAHO8';
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            loadServices();
            loadCategories();
            loadCustomers();
            loadCustomerServices();
        }

        function showAlert(message, type = 'info', isModal = false) {
            const container = isModal ? document.getElementById('modalAlertContainer') : document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            const alertDiv = document.createElement('div');
            alertDiv.id = alertId;
            alertDiv.className = `alert ${type}`;
            alertDiv.textContent = message;
            container.appendChild(alertDiv);

            setTimeout(() => {
                const el = document.getElementById(alertId);
                if (el) el.remove();
            }, 5000);
        }

        async function generateCustomerCode(fullName) {
            try {
                const firstName = fullName.trim().split(' ')[0].toUpperCase().replace(/[^A-Z]/g, '');
                if (!firstName) throw new Error('Invalid name');

                const { data: existingCustomers, error } = await supabase
                    .from('customers')
                    .select('customer_code')
                    .ilike('customer_code', `${firstName}-%`);

                if (error) throw error;

                let maxNumber = 0;
                (existingCustomers || []).forEach(c => {
                    if (c.customer_code) {
                        const parts = c.customer_code.split('-');
                        const num = parseInt(parts[1]) || 0;
                        if (num > maxNumber) maxNumber = num;
                    }
                });

                const nextNumber = maxNumber + 1;
                return `${firstName}-${String(nextNumber).padStart(3, '0')}`;
            } catch (error) {
                console.error('Error generating customer code:', error);
                return `CUST-${Date.now()}`;
            }
        }

        async function loadCustomers() {
            try {
                const { data, error } = await supabase
                    .from('customers')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allCustomers = data || [];
                filteredCustomers = [...allCustomers];
                renderCustomers();
            } catch (error) {
                console.error('Error loading customers:', error);
                showAlert('Error loading customers: ' + error.message, 'error', false);
            } finally {
                document.getElementById('loadingState').style.display = 'none';
            }
        }

        async function loadServices() {
            try {
                const { data, error } = await supabase
                    .from('service_items')
                    .select('*')
                    .eq('is_active', true);

                if (error) throw error;
                allServices = data || [];
            } catch (error) {
                console.error('Error loading services:', error);
            }
        }

        async function loadCategories() {
            try {
                const { data, error } = await supabase
                    .from('service_categories')
                    .select('*')
                    .eq('is_active', true);

                if (error) throw error;
                allCategories = data || [];
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        async function loadCustomerServices() {
            try {
                const { data, error } = await supabase
                    .from('customer_services')
                    .select('*')
                    .eq('is_active', true);

                if (error) throw error;
                allCustomerServices = data || [];
            } catch (error) {
                console.error('Error loading customer services:', error);
            }
        }

        function renderCustomers() {
            const tableBody = document.getElementById('tableBody');
            const tableState = document.getElementById('tableState');
            const emptyState = document.getElementById('emptyState');

            if (filteredCustomers.length === 0) {
                tableState.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            tableState.style.display = 'block';
            emptyState.style.display = 'none';
            tableBody.innerHTML = '';

            filteredCustomers.forEach(customer => {
                const row = document.createElement('tr');
                const customerCode = customer.customer_code || '-';
                const status = customer.status || 'active';
                const lastActivity = customer.last_activity_date ? new Date(customer.last_activity_date).toLocaleDateString('en-IN') : '-';
                const interactions = customer.total_interactions || 0;

                row.innerHTML = `
                    <td><span class="customer-code-badge">${customerCode}</span></td>
                    <td><strong>${customer.full_name || '-'}</strong></td>
                    <td>${customer.email || '-'}</td>
                    <td>${customer.mobile_no || '-'}</td>
                    <td>${customer.company_name || '-'}</td>
                    <td><span class="status-badge status-${status}">${status}</span></td>
                    <td>${lastActivity}</td>
                    <td><span class="interaction-count">${interactions}</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-sm btn-primary" onclick="editCustomer('${customer.id}')" title="Edit customer">✏️ Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCustomer('${customer.id}')" title="Delete customer">🗑️ Delete</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function filterCustomers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            filteredCustomers = allCustomers.filter(customer => {
                const matchesSearch = !searchTerm ||
                    (customer.customer_code?.toLowerCase().includes(searchTerm)) ||
                    (customer.full_name?.toLowerCase().includes(searchTerm)) ||
                    (customer.email?.toLowerCase().includes(searchTerm)) ||
                    (customer.mobile_no?.includes(searchTerm)) ||
                    (customer.company_name?.toLowerCase().includes(searchTerm));

                const matchesStatus = !statusFilter || (customer.status === statusFilter);
                return matchesSearch && matchesStatus;
            });
            renderCustomers();
        }

        function switchTab(tabName, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            if (evt && evt.target) evt.target.classList.add('active');

            if (tabName === 'services' && editingCustomerId) {
                loadCustomerServicesForEdit();
            } else if (tabName === 'notes' && editingCustomerId) {
                loadCustomerNotes();
            } else if (tabName === 'activity' && editingCustomerId) {
                loadCustomerActivities();
            }
        }

        async function loadCustomerNotes() {
            if (!editingCustomerId) return;
            try {
                const { data, error } = await supabase
                    .from('customer_notes')
                    .select('*')
                    .eq('customer_id', editingCustomerId)
                    .order('created_at', { ascending: false });
                if (error) throw error;
                currentCustomerNotes = data || [];
                renderNotes();
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        function renderNotes() {
            const notesList = document.getElementById('notesList');
            if (currentCustomerNotes.length === 0) {
                notesList.innerHTML = '<p style="color: var(--text-secondary);">No notes yet</p>';
                return;
            }
            notesList.innerHTML = currentCustomerNotes.map(note => `
                <div class="note-item">
                    <div class="note-header">
                        <div>${note.note_text}</div>
                        <span class="note-type">${note.note_type}</span>
                    </div>
                    <div class="note-header" style="font-weight: normal; color: var(--text-secondary);">
                        <small>${note.created_by || 'System'}</small>
                        <small>${new Date(note.created_at).toLocaleDateString('en-IN')}</small>
                    </div>
                </div>
            `).join('');
        }

        async function addNote() {
            if (!editingCustomerId) return;
            const noteText = document.getElementById('noteText').value.trim();
            const noteType = document.getElementById('noteType').value;
            if (!noteText) {
                showAlert('Please enter a note', 'error', true);
                return;
            }
            try {
                const userData = JSON.parse(localStorage.getItem('dreamHarbourUser'));
                const { error } = await supabase
                    .from('customer_notes')
                    .insert([{
                        customer_id: editingCustomerId,
                        note_text: noteText,
                        note_type: noteType,
                        created_by: userData.fullName || 'User'
                    }]);
                if (error) throw error;
                showAlert('✅ Note added successfully!', 'success', true);
                document.getElementById('noteText').value = '';
                loadCustomerNotes();
            } catch (error) {
                console.error('Error adding note:', error);
                showAlert('Error adding note: ' + error.message, 'error', true);
            }
        }

        async function loadCustomerActivities() {
            if (!editingCustomerId) return;
            try {
                const { data, error } = await supabase
                    .from('customer_activities')
                    .select('*')
                    .eq('customer_id', editingCustomerId)
                    .order('created_at', { ascending: false })
                    .limit(20);
                if (error) throw error;
                currentCustomerActivities = data || [];
                renderActivities();
            } catch (error) {
                console.error('Error loading activities:', error);
            }
        }

        function renderActivities() {
            const activityList = document.getElementById('activityList');
            if (currentCustomerActivities.length === 0) {
                activityList.innerHTML = '<p style="color: var(--text-secondary);">No activities yet</p>';
                return;
            }

            activityList.innerHTML = currentCustomerActivities.map(activity => {
                const typeLabel = activity.activity_type
                    ? activity.activity_type.replace(/_/g, ' ')
                    : 'activity';
                const userLabel = activity.created_by || 'System';
                const timeLabel = new Date(activity.created_at).toLocaleString('en-IN');
                const desc = activity.activity_description || '';

                return `
                    <div class="activity-item">
                        <div class="activity-dot"></div>
                        <div class="activity-content">
                            <div class="activity-type">${typeLabel}</div>
                            <div>${desc}</div>
                            <div class="activity-time">${userLabel} • ${timeLabel}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function logActivity(activityType, description = '') {
            if (!editingCustomerId) return;
            try {
                const userData = JSON.parse(localStorage.getItem('dreamHarbourUser'));
                await supabase
                    .from('customer_activities')
                    .insert([{
                        customer_id: editingCustomerId,
                        activity_type: activityType,
                        activity_description: description,
                        created_by: userData.fullName || 'User'
                    }]);
            } catch (error) {
                console.error('Error logging activity:', error);
            }
        }

        function searchServicesForCustomer() {
            const searchTerm = document.getElementById('serviceSearchInput').value.trim();
            const autocompleteList = document.getElementById('serviceAutoComplete');

            if (!searchTerm || searchTerm.length < 1) {
                autocompleteList.classList.remove('show');
                return;
            }

            serviceSearchResults = allServices.filter(s => {
                if (!s.service_name) return false;
                return s.service_name.toLowerCase().includes(searchTerm.toLowerCase());
            });

            if (serviceSearchResults.length === 0) {
                autocompleteList.innerHTML = '<div style="padding: 10px; text-align: center; color: #999;">No services found</div>';
                autocompleteList.classList.add('show');
                return;
            }

            autocompleteList.innerHTML = serviceSearchResults.map((service, index) => `
                <button type="button" class="autocomplete-item" data-index="${index}" onclick="selectServiceForCustomer(${index}); return false;">
                    <strong>📦 ${service.service_name}</strong>
                </button>
            `).join('');

            autocompleteList.classList.add('show');
        }

        function selectServiceForCustomer(index) {
            if (index < 0 || index >= serviceSearchResults.length) return;
            selectedService = serviceSearchResults[index];
            document.getElementById('serviceSearchInput').value = selectedService.service_name;
            document.getElementById('serviceAutoComplete').classList.remove('show');
        }

        async function addServiceToCustomer() {
            if (!selectedService) {
                showAlert('Please select a service', 'error', true);
                return;
            }
            if (!editingCustomerId) {
                showAlert('Please save customer first', 'error', true);
                return;
            }

            try {
                const { error } = await supabase
                    .from('customer_services')
                    .insert([{
                      customer_id: editingCustomerId,
                      service_id: selectedService.id,
                      service_name: selectedService.service_name,
                      is_active: true,
                      service_status: 'pending',
                      amount_total: 0,
                      amount_paid: 0
                    }]);

                if (error) throw error;

                showAlert('✅ Service added for customer!', 'success', true);
                await logActivity('service_added', `Added service: ${selectedService.service_name}`);

                document.getElementById('serviceSearchInput').value = '';
                selectedService = null;

                loadCustomerServicesForEdit();
                loadCustomerServices();
            } catch (error) {
                console.error('Error adding service:', error);
                showAlert('Error adding service: ' + error.message, 'error', true);
            }
        }

        async function loadCustomerServicesForEdit() {
            if (!editingCustomerId) return;
            try {
                const { data, error } = await supabase
                    .from('customer_services')
                    .select('*')
                    .eq('customer_id', editingCustomerId)
                    .eq('is_active', true);
                if (error) throw error;
                currentCustomerServices = data || [];
                renderCustomerServices();
            } catch (error) {
                console.error('Error loading customer services:', error);
            }
        }

        function renderCustomerServices() {
            const list = document.getElementById('customerServicesList');
            if (currentCustomerServices.length === 0) {
                list.innerHTML = '<p style="color: var(--text-secondary);">No services added yet</p>';
                return;
            }

            list.innerHTML = currentCustomerServices.map(service => `
                <div class="service-card">
                    <div class="service-card-header">
                        <div class="service-card-name">📦 ${service.service_name}</div>
                        <div class="service-card-actions">
                            <button class="btn-remove-service" onclick="removeCustomerService('${service.id}')">Remove</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function removeCustomerService(serviceId) {
            if (!confirm('Remove this service from customer?')) return;
            try {
                const { error } = await supabase
                    .from('customer_services')
                    .update({ is_active: false })
                    .eq('id', serviceId);
                if (error) throw error;
                showAlert('✅ Service removed successfully!', 'success', true);
                await logActivity('service_removed', 'Service removed');
                loadCustomerServicesForEdit();
                loadCustomerServices();
            } catch (error) {
                console.error('Error removing service:', error);
                showAlert('Error removing service: ' + error.message, 'error', true);
            }
        }

        function openAddCustomerModal() {
            editingCustomerId = null;
            currentCustomerNotes = [];
            currentCustomerActivities = [];
            currentCustomerServices = [];
            document.getElementById('modalTitle').textContent = '➕ Add Customer';
            clearCustomerForm();
            switchTab('details');
            document.getElementById('customerModal').style.display = 'block';
        }

        function clearCustomerForm() {
            document.getElementById('customerName').value = '';
            document.getElementById('customerEmail').value = '';
            document.getElementById('customerMobileNo').value = '';
            document.getElementById('customerCompany').value = '';
            document.getElementById('customerAddress').value = '';
            document.getElementById('customerGstin').value = '';
            document.getElementById('customerStatus').value = 'active';
            document.getElementById('serviceSearchInput').value = '';
            document.getElementById('noteText').value = '';
            document.getElementById('customerServicesList').innerHTML = '<p style="color: var(--text-secondary);">No services added yet</p>';
            document.getElementById('notesList').innerHTML = '<p style="color: var(--text-secondary);">No notes yet</p>';
            document.getElementById('activityList').innerHTML = '<p style="color: var(--text-secondary);">No activities yet</p>';
            document.getElementById('modalAlertContainer').innerHTML = '';
        }

        async function editCustomer(customerId) {
            const customer = allCustomers.find(c => c.id === customerId);
            if (!customer) return;
            editingCustomerId = customerId;
            document.getElementById('modalTitle').textContent = '✏️ Edit Customer';
            document.getElementById('customerName').value = customer.full_name || '';
            document.getElementById('customerEmail').value = customer.email || '';
            document.getElementById('customerMobileNo').value = customer.mobile_no || '';
            document.getElementById('customerCompany').value = customer.company_name || '';
            document.getElementById('customerAddress').value = customer.address || '';
            document.getElementById('customerGstin').value = customer.gstin || '';
            document.getElementById('customerStatus').value = customer.status || 'active';
            switchTab('details');
            document.getElementById('customerModal').style.display = 'block';
            await loadCustomerNotes();
            await loadCustomerActivities();
            await loadCustomerServicesForEdit();
        }

        async function saveCustomer() {
            try {
                const name = document.getElementById('customerName').value.trim();
                const email = document.getElementById('customerEmail').value.trim();
                const mobileNo = document.getElementById('customerMobileNo').value.trim();
                const status = document.getElementById('customerStatus').value;
                if (!name || !email || !mobileNo) {
                    showAlert('Please fill in required fields (Name, Email, Mobile)', 'error', true);
                    return;
                }
                if (!/^[0-9]{10}$/.test(mobileNo)) {
                    showAlert('Mobile number must be 10 digits', 'error', true);
                    return;
                }

                const normalizedMobile = mobileNo.replace(/\D/g, '');
                const customerData = {
                    full_name: name,
                    email,
                    mobile_no: normalizedMobile,
                    company_name: document.getElementById('customerCompany').value || null,
                    address: document.getElementById('customerAddress').value || null,
                    gstin: document.getElementById('customerGstin').value || null,
                    status
                };

                if (editingCustomerId) {
                    const currentCustomer = allCustomers.find(c => c.id === editingCustomerId);
                    
                    const { error } = await supabase
                        .from('customers')
                        .update(customerData)
                        .eq('id', editingCustomerId);
                    if (error) throw error;

                    const changes = [];
                    if (currentCustomer.full_name !== name) changes.push(`Name: ${currentCustomer.full_name} → ${name}`);
                    if (currentCustomer.email !== email) changes.push(`Email: ${currentCustomer.email} → ${email}`);
                    if (currentCustomer.mobile_no !== normalizedMobile) changes.push(`Mobile: ${currentCustomer.mobile_no} → ${normalizedMobile}`);
                    if (currentCustomer.status !== status) changes.push(`Status: ${currentCustomer.status} → ${status}`);
                    if (currentCustomer.company_name !== (customerData.company_name || null)) changes.push(`Company: ${currentCustomer.company_name || '-'} → ${customerData.company_name || '-'}`);
                    if (currentCustomer.address !== (customerData.address || null)) changes.push(`Address: ${currentCustomer.address || '-'} → ${customerData.address || '-'}`);
                    if (currentCustomer.gstin !== (customerData.gstin || null)) changes.push(`GSTIN: ${currentCustomer.gstin || '-'} → ${customerData.gstin || '-'}`);

                    const changeDescription = changes.length > 0 ? changes.join(' | ') : 'No changes';
                    
                    showAlert('✅ Customer updated successfully!', 'success', true);
                    await logActivity('customer_updated', changeDescription);
                } else {
                    customerData.customer_code = await generateCustomerCode(name);

                    const { data, error } = await supabase
                        .from('customers')
                        .insert([customerData])
                        .select()
                        .single();

                    if (error) throw error;
                    editingCustomerId = data.id;
                    await logActivity('customer_created', 'Customer added');
                    showAlert(`✅ Customer added successfully! Code: ${customerData.customer_code}`, 'success', true);
                }

                closeModal();
                loadCustomers();
            } catch (error) {
                console.error('Error saving customer:', error);
                showAlert('Error saving customer: ' + error.message, 'error', true);
            }
        }

        async function deleteCustomer(customerId) {
            if (!confirm('Are you sure you want to delete this customer?')) return;
            try {
                const { error } = await supabase
                    .from('customers')
                    .delete()
                    .eq('id', customerId);
                if (error) throw error;
                showAlert('✅ Customer deleted successfully!', 'success', false);
                loadCustomers();
            } catch (error) {
                console.error('Error deleting customer:', error);
                showAlert('Error deleting customer: ' + error.message, 'error', false);
            }
        }

        function downloadExcel() {
            if (filteredCustomers.length === 0) {
                showAlert('No customers to download', 'error', false);
                return;
            }

            const data = filteredCustomers.map(c => ({
                'Customer Code': c.customer_code || '',
                'Full Name': c.full_name || '',
                'Email': c.email || '',
                'Mobile No': c.mobile_no || '',
                'Company': c.company_name || '',
                'Address': c.address || '',
                'GSTIN': c.gstin || '',
                'Status': c.status || 'active',
                'Last Activity': c.last_activity_date ? new Date(c.last_activity_date).toLocaleDateString('en-IN') : '-',
                'Interactions': c.total_interactions || 0,
                'Created Date': new Date(c.created_at).toLocaleDateString('en-IN')
            }));

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Customers');
            XLSX.writeFile(workbook, `dream-harbour-customers-${new Date().getTime()}.xlsx`);
            showAlert('✅ Excel file downloaded successfully!', 'success', false);
        }

        function closeModal() {
            document.getElementById('customerModal').style.display = 'none';
        }

        function logout() {
            localStorage.removeItem('dreamHarbourUser');
            localStorage.removeItem('dreamHarbourLoginTime');
            window.location.href = 'index.html';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('customerModal');
            const serviceAutocomplete = document.getElementById('serviceAutoComplete');
            if (event.target === modal) modal.style.display = 'none';
            if (!event.target.closest('.form-group') && !event.target.matches('#serviceSearchInput')) {
                serviceAutocomplete.classList.remove('show');
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
