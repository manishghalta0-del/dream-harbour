<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings - Dream Harbour</title><link rel="stylesheet" href="styles.css"><style>.settings-form{background:rgba(33,38,45,0.6);border:1px solid #30363d;border-radius:12px;padding:24px;backdrop-filter:blur(10px);margin-bottom:24px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.service-item{background:rgba(0,0,0,0.2);border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:16px;border-bottom:2px solid #30363d;margin-bottom:24px}.tab{padding:12px 24px;cursor:pointer;border-bottom:3px solid transparent;color:#8b949e;font-weight:600}.tab.active{border-bottom-color:#8b5cf6;color:#8b5cf6}.tab-content{display:none}.tab-content.active{display:block}</style></head><body><nav class="navbar"><div class="navbar-brand">🏛️ Dream Harbour</div><div class="navbar-user"><span id="userName">Loading...</span><button style="background:#ef4444;color:white;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:600" onclick="logout()">Logout</button></div></nav><aside class="sidebar"><a href="dashboard-new.html" class="sidebar-item">📊 Dashboard</a><a href="invoices-new.html" class="sidebar-item">📄 Invoices</a><a href="settings-new.html" class="sidebar-item active">⚙️ Settings</a></aside><main class="main-content"><h1>Settings</h1><div class="tabs"><div class="tab active" onclick="switchTab('business')">Business Info</div><div class="tab" onclick="switchTab('services')">Services</div></div><div id="business" class="tab-content active"><div class="settings-form"><h3>Business Information</h3><div class="form-row"><div class="form-group"><label>Business Name</label><input type="text" id="businessName" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div><div class="form-group"><label>Owner Name</label><input type="text" id="ownerName" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div></div><div class="form-row"><div class="form-group"><label>GSTIN</label><input type="text" id="gstin" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div><div class="form-group"><label>Phone</label><input type="text" id="phone" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div></div><div class="form-group"><label>Address</label><textarea id="address" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px;height:100px"></textarea></div><button onclick="saveBusinessSettings()" class="btn btn-primary">Save Settings</button></div></div><div id="services" class="tab-content"><div class="settings-form"><h3>Manage Services</h3><div style="margin-bottom:24px"><div class="form-group"><label>Category Name</label><input type="text" id="catName" placeholder="Enter category name" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div><div class="form-group"><label>Service Name</label><input type="text" id="srvName" placeholder="Enter service name" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div><div class="form-group"><label>SAC Code</label><input type="text" id="sacCode" placeholder="e.g., 998595" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"></div><div class="form-group"><label>GST %</label><select id="gstPct" style="width:100%;padding:8px;background:#0f1117;border:1px solid #30363d;color:#e6edf3;border-radius:6px"><option value="0">0% (No GST)</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></div><button onclick="addService()" class="btn btn-primary">Add Service</button></div><h4>Services List</h4><div id="servicesList"></div></div></div></main><div id="debug-console" style="position:fixed;bottom:0;right:0;width:400px;max-height:150px;background:rgba(15,17,23,0.95);border:1px solid #30363d;border-bottom:none;border-right:none;overflow-y:auto;padding:12px;font-family:monospace;font-size:11px;z-index:1000;color:#8b949e"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>function logout(){clearUserSession();window.location.href='index.html'}function switchTab(tab){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));event.target.classList.add('active');document.getElementById(tab).classList.add('active')}async function loadSettings(){const user=getUserSession();if(!user){window.location.href='index.html';return}document.getElementById('userName').textContent=user.full_name;const settings=await fetchBusinessSettings();if(settings){document.getElementById('businessName').value=settings.business_name||'';document.getElementById('ownerName').value=settings.owner_name||'';document.getElementById('gstin').value=settings.gstin||'';document.getElementById('phone').value=settings.phone||'';document.getElementById('address').value=settings.address||''}const cats=await fetchCategories();const list=document.getElementById('servicesList');list.innerHTML=cats.map(c=>`<div class="service-item"><div><strong>${c.category_name}</strong></div><button onclick="deleteService('${c.id}')" style="background:#ef4444;color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer">Delete</button></div>`).join('')}async function saveBusinessSettings(){const data={business_name:document.getElementById('businessName').value,owner_name:document.getElementById('ownerName').value,gstin:document.getElementById('gstin').value,phone:document.getElementById('phone').value,address:document.getElementById('address').value};try{await updateBusinessSettings(data);showToast('Settings saved!','success')}catch(e){showToast('Error: '+e.message,'error')}}function addService(){showToast('Service management coming soon','info')}function deleteService(id){showToast('Delete feature coming soon','info')}window.addEventListener('DOMContentLoaded',loadSettings)</script></body></html>
